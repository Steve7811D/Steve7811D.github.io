<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>导航</title>
<style>
:root{
  --primary:#4f6ef7; --primary-d:#3d59e0; --accent:#22c55e; --warn:#f59e0b;
  --bg:#ffffff; --card:rgba(255,255,255,0.72); --text:#1f2937; --muted:#8a94a6;
  --radius:18px; --shadow:0 12px 36px rgba(31,41,55,.12);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}

/* ===== 地图画布（全屏，支持缩放/平移）===== */
#viewport{position:fixed;inset:0;overflow:hidden;background:#e8ecf3;touch-action:none}
#transform{position:absolute;left:0;top:0;transform-origin:0 0}
#transform.animate{transition:transform .5s cubic-bezier(.22,1,.36,1)}
#wrap{position:relative;display:inline-block;background:#e2e6ed;box-shadow:0 2px 20px rgba(0,0,0,.25)}
#map{display:block;max-width:none;width:100%;height:100%;-webkit-user-drag:none}
#svg{position:absolute;left:0;top:0;pointer-events:none}

/* ===== 顶部栏 ===== */
#topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:linear-gradient(135deg,var(--primary),#7b5cf7);color:#fff}
#topbar .title{font-size:15px;font-weight:700;letter-spacing:.5px;flex:0 0 auto}
#topbar .locate{flex:1}
#topbar .icon-btn{width:32px;height:32px;border:none;border-radius:9px;background:rgba(255,255,255,.22);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
#topbar .icon-btn:active{background:rgba(255,255,255,.35)}

/* 底部操作面板 */
#bottombar{position:fixed;left:0;right:0;bottom:calc(12px + var(--safe-b));z-index:30;padding:0 12px 0;pointer-events:none;transition:transform .3s cubic-bezier(.4,0,.2,1),opacity .25s ease}
#bottombar.dock-out{transform:translateY(calc(100% + 300vh));opacity:0;pointer-events:none}
#bottombar #route-form{pointer-events:auto}
#route-form{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:8px;transition:opacity .2s ease;backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%)}
#route-form.collapsed{display:none}
.field{position:relative;margin-bottom:6px}
.field .icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.field .icon.start{background:var(--accent)}
.field .icon.end{background:#ef4444}
.field input{width:100%;padding:7px 10px 7px 26px;border:1.5px solid #e4e8f0;border-radius:9px;font-size:13px;background:#fafbfd;color:var(--text);outline:none}
.field input:focus{border-color:var(--primary);background:#fff}
.suggest{position:absolute;left:0;right:0;bottom:calc(100% + 4px);z-index:100;background:#fff;border:1px solid #e4e8f0;border-radius:10px;box-shadow:0 6px 20px rgba(31,41,55,.14);max-height:240px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;display:none}
.suggest.show{display:block}
.suggest .item{padding:10px 12px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px;border-bottom:1px solid #f3f5f9}
.suggest .item:last-child{border-bottom:none}
.suggest .item:hover,.suggest .item.active{background:#eef2ff}
.suggest .item .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:#c7d0e0}
.suggest .item mark{background:transparent;color:var(--primary);font-weight:700}
.suggest .empty{padding:12px;text-align:center;color:var(--muted);font-size:13px}
.btn-row{display:flex;gap:8px;margin-top:2px}
.btn{flex:1;padding:9px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:transform .06s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--primary),#7b5cf7);color:#fff}
.btn.ghost{background:#eef1f7;color:#4b5563}
.disclaimer{text-align:center;font-size:11px;color:var(--muted);padding:2px 0 6px;margin-bottom:2px;line-height:1.4}

/* 路线卡片结果 */
#result-panel{position:fixed;left:14px;right:14px;bottom:calc(12px + var(--safe-b));z-index:60;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;max-height:45vh;overflow:auto;display:none;backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%)}
#result-panel.show{display:block}
#result-panel .close{float:right;border:none;background:#eef1f7;border-radius:8px;width:28px;height:28px;cursor:pointer;font-size:15px;color:#4b5563}
#result-panel h3{margin:0 0 10px;font-size:16px}
.route-card{border:1.5px solid #e4e8f0;border-radius:12px;padding:10px;margin:8px 0;cursor:pointer;background:#fff;transition:all .15s}
.route-card:hover{background:#f6f8ff}
.route-card.selected{border-color:var(--primary);background:#eef2ff}
.route-card b{display:block;margin-bottom:3px;font-size:14px}
.route-card .small{display:block;color:var(--muted);font-size:12px}
.res-meta{font-size:13px;line-height:1.7;color:#4b5563}
.res-meta b{color:var(--text)}

/* 缩放控件 */


/* SVG 图元 */
.node{fill:#4f6ef7;stroke:#fff;stroke-width:2}
.place-dot{fill:#4f6ef7;stroke:#fff;stroke-width:2;cursor:pointer;pointer-events:all}
.place-label{font-size:12px;fill:#1f2937;stroke:#fff;stroke-width:3px;paint-order:stroke;font-weight:600}
.route{fill:none;stroke:#ff1744;stroke-width:10;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.route-casing{fill:none;stroke:#fff;stroke-width:14;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.route-arrow{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-dasharray:0 28;stroke-linejoin:round;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.endpoint{fill:#22c55e;stroke:#fff;stroke-width:3}

/* 空状态 / 加载 */
#loading{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:var(--bg);flex-direction:column;gap:12px;color:var(--muted);transition:opacity .6s ease}
#loading.fade-out{opacity:0;pointer-events:none}
#loading .spin{width:34px;height:34px;border:3px solid #e4e8f0;border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite}
/* AI 计算提示：非全屏小横条，蓝底白字，悬浮在底部导航栏上方 */
#calcloading{position:fixed;left:50%;right:auto;bottom:calc(var(--safe-b,0px) + 214px);z-index:50;transform:translateX(-50%);display:none;align-items:center;gap:8px;background:var(--primary);color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;box-shadow:0 4px 16px rgba(79,110,247,.35)}
#calcloading.show{display:flex}
#calcloading .spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* 顶部条：指南针与搜索栏都在最顶端同一行 */
#toprow{position:fixed;left:0;right:0;top:0;z-index:1000;display:flex;align-items:center;gap:8px;padding:8px 12px 0;padding-top:calc(8px + env(safe-area-inset-top,0px))}
/* 东南西北罗盘（正十字，字靠紧中心箭头；与 dock 一致磨砂）*/
#compass{width:52px;height:52px;border-radius:50%;background:var(--card);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:var(--shadow);user-select:none;pointer-events:auto;flex:0 0 auto;position:relative}
#compass .cp-ring{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:center}
#compass .cp-n,#compass .cp-e,#compass .cp-s,#compass .cp-w{position:absolute;font-size:10px;font-weight:700;line-height:1}
#compass .cp-n{left:50%;top:5px;transform:translateX(-50%);color:#ef4444}
#compass .cp-s{left:50%;bottom:5px;transform:translateX(-50%);color:#8a94a6}
#compass .cp-e{right:5px;top:50%;transform:translateY(-50%);color:#8a94a6}
#compass .cp-w{left:5px;top:50%;transform:translateY(-50%);color:#8a94a6}
#compass .cp-needle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:18px;color:var(--primary)}
/* 地点搜索条（指南针右侧） */
#locbar{flex:1;display:flex;align-items:center;gap:6px;position:relative}
#loc-input{flex:1;border:none;border-radius:10px;padding:10px 12px;font-size:14px;color:var(--text);background:var(--card);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:var(--shadow);outline:none}
#loc-input::placeholder{color:var(--muted)}
#loc-btn{flex:0 0 auto;border:none;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--primary),#7b5cf7);box-shadow:var(--shadow);cursor:pointer}
#loc-btn:active{transform:scale(.96)}
#gps-status{position:fixed;left:50%;top:calc(68px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:1002;background:rgba(31,41,55,.9);color:#fff;padding:8px 13px;border-radius:18px;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.2);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .35s ease}
#gps-status.show{opacity:1}

#loc-suggest{position:absolute;left:0;right:64px;top:100%;margin-top:4px;z-index:1001;background:var(--card);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:none;border-radius:10px;box-shadow:0 6px 20px rgba(31,41,55,.25);max-height:400px;overflow-y:auto;display:none}
#loc-suggest.show{display:block}
#loc-suggest .item{padding:10px 12px;font-size:14px;cursor:pointer;border-bottom:1px solid #f3f5f9;color:var(--text)}
#loc-suggest .item:last-child{border-bottom:none}
#loc-suggest .item:hover,#loc-suggest .item:active{background:#eef2ff}

.hidden{display:none!important}
/* 软键盘弹出时，WebView 会自动 resize 视口，此处不再手动上移（避免表单飞上去） */


/* zoom control + / - */
#zoom-control{position:fixed;right:14px;bottom:calc(var(--safe-b,0px) + 214px);z-index:45;display:flex;flex-direction:column;gap:6px}
#zoom-control button{width:42px;height:42px;border:1px solid rgba(255,255,255,.35);border-radius:50%;font-size:24px;font-weight:500;line-height:1;color:#fff;background:rgba(255,255,255,.18);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:0 4px 16px rgba(31,41,55,.18);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,transform .1s}
#zoom-control button:active{transform:scale(.92)}
#zoom-control button:hover{background:rgba(255,255,255,.30)}

/* 定位按钮（替换自导航.html样式）：蓝色圆 + 定位 pin 图标；初始黄(loc-wait) → 定位成功变蓝 */
#fuse-locate{display:flex;align-items:center;justify-content:center;flex:0 0 auto}
#fuse-locate #loc-btn2{width:42px;height:42px;border:1px solid rgba(255,255,255,.35);border-radius:50%;background:#1BA1E2;color:#fff;box-shadow:0 4px 16px rgba(27,161,226,.45);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .3s,box-shadow .3s,transform .15s}
#fuse-locate #loc-btn2:active{transform:scale(.9)}
#fuse-locate #loc-btn2 svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.4}
#fuse-locate #loc-btn2.loc-wait{background:#F5A623;box-shadow:0 4px 16px rgba(245,166,35,.55);border-color:rgba(255,255,255,.6)}

/* Desktop layout (tablet/PC >=768px) */
@media (min-width:768px){
  /* search bar: top-left */
  #toprow{position:fixed;top:14px;left:14px;right:auto;bottom:auto;z-index:1000;width:360px;padding:0;display:flex;align-items:flex-start;gap:8px}
  /* compass: top-right (detached from toprow) */
  #compass{position:fixed;top:14px;left:auto;right:14px;width:56px;height:56px;flex:0 0 auto;z-index:1002}
  #toprow #locbar{flex:1;width:auto;position:relative}
  #loc-input{font-size:14px}
  #loc-suggest{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:1001}

  /* nav form: bottom-left, never auto-hide on desktop */
  #bottombar{position:fixed;left:14px;right:auto;bottom:14px;top:auto;width:360px;padding:0;pointer-events:none;transform:none;transition:none}
  #bottombar.dock-out{transform:none;opacity:1;pointer-events:none}
#bottombar #route-form{pointer-events:auto;max-height:calc(100vh - 160px);overflow:visible}

  /* result panel: bottom-left above nav */
  #result-panel{position:fixed;left:14px;right:auto;bottom:14px;width:360px;max-height:calc(100vh - 160px)}

  /* disclaimer: fixed bottom-right, white text only */
  .disclaimer{position:fixed;left:auto;right:14px;bottom:12px;top:auto;text-align:right;padding:0;margin:0;color:#fff;font-size:12px;font-weight:600;line-height:1.4;pointer-events:auto;z-index:40;text-shadow:0 1px 3px rgba(0,0,0,.6),0 0 6px rgba(0,0,0,.4)}
  /* zoom control: above disclaimer bottom-right */
  #zoom-control{right:14px;bottom:44px}
  #calcloading{left:50%;right:auto;bottom:44px;transform:translateX(-50%)}

}
</style>
</head>

<div id="calcloading"><div class="spin"></div><div>计算最短路线中…</div></div>

<div id="viewport">
  <div id="transform">
    <div id="wrap" hidden>
      <img id="map" draggable="false">
      <svg id="svg"></svg>
    </div>
  </div>
</div>

<!-- 顶部条：指南针 + 地点搜索栏 -->
<div id="toprow">
  <div id="compass" title="方位指示"><div class="cp-ring"><span class="cp-n">北</span><span class="cp-e">东</span><span class="cp-s">南</span><span class="cp-w">西</span></div><span class="cp-needle">▲</span></div>
  <div id="locbar">
    <input id="loc-input" type="text" placeholder="请输入地点" autocomplete="off">
    <button id="loc-btn">确认</button>
    <div id="loc-suggest"></div>
  </div>
</div>

</div>
<div id="gps-status"></div>

<div id="result-panel">
  <button class="close" id="closeResult">✕</button>
  <div id="result" class="res-meta"></div>
</div>

<div id="bottombar">
  <div id="route-form">
    <div class="field">
      <span class="icon start"></span>
      <input id="start" type="text" placeholder="起点 · 搜索地点" autocomplete="off">
      <div class="suggest" id="sg-start"></div>
    </div>
    <div class="field">
      <span class="icon end"></span>
      <input id="end" type="text" placeholder="终点 · 搜索地点" autocomplete="off">
      <div class="suggest" id="sg-end"></div>
    </div>
    <div class="field">
      <span class="icon via" style="background:#f59e0b"></span>
      <input id="via" type="text" placeholder="途经点（可选）· 搜索地点" autocomplete="off">
      <div class="suggest" id="sg-via"></div>
    </div>
    <div class="disclaimer">非官方项目，仅供学习参考，侵权请联系删除 · <a href="二维码.jpg" target="_blank" style="color:inherit;text-decoration:underline;pointer-events:auto">问题反馈</a></div>
    <div class="btn-row">
      <button id="routeBtn" class="btn primary">开始导航</button>
      <button id="clearBtn" class="btn ghost">清除</button>
    </div>
  </div>
</div>

<!-- 隐藏的文件导入（网页版兜底） -->
<!-- 缂╂斁鎺т欢 + / - -->
<div id="zoom-control">
  <div id="fuse-locate">
    <button id="loc-btn2" title="定位我的位置" aria-label="定位">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11z"/>
        <circle cx="12" cy="10" r="3" fill="currentColor" stroke="none"/>
      </svg>
    </button>
  </div>
  <button id="zoom-in" title="放大">+</button>
  <button id="zoom-out" title="缩小">−</button>
</div>

<input id="imgFile" type="file" accept="image/*" class="hidden">
<input id="jsonFile" type="file" accept=".json,application/json" class="hidden">

<script>
const $=id=>document.getElementById(id);
let data=null, imgURL=null, readyImg=false, routeOptions=[], selectedRouteIndex=-1;
let sp=null, ep=null, vp=null;

// —— 寻路优化参数 ——
const TURN_PENALTY = 30;
const SNAP_DIR_WEIGHT = 3.0;
const METER_PER_PX = 0.586;

// ===== GPS 无需用户校准：固定校园坐标基准 =====
// 地图按“1 像素 = 0.586 米”，假定图片北向上。
// 基准点采用公开的曲阜师范大学（曲阜校区）中心近似坐标；如后续拿到更精确控制点，只需修改这里。
const GPS_MAP_CONFIG = {
  metersPerPixel: 0.586,
  // 图片中心（按当前地图 2696×1780 的中心）
  mapAnchorX: 1348,
  mapAnchorY: 890,
  // 曲阜师范大学曲阜校区公开坐标近似：35.5959N, 116.95765E
  latitude: 35.5959,
  longitude: 116.95765
};
let gpsWatchId = null;
let gpsPoint = null;
let gpsHeading = null;
let deviceHeading = null; // 设备朝向（罗盘），用于“我的位置”箭头指向手机朝向
let gpsNavigating = false;
let gpsLastAccuracy = null;
let gpsLastRecalc = 0;
let gpsPendingFirstFix = false; // 点击定位后，等待首次成功回调做一次性动作（设起点+居中+弹窗）
const GPS_RECALC_MIN_MS = 3500;
const GPS_OFF_ROUTE_PX = 60; // 约35米

// ===== 吃豆人导航：记录完整路线坐标，按当前位置把已走过的路线“吃掉” =====
let navFullPts = null;        // 完整导航路线坐标点数组（[[x,y],...]，按顺序）
let navLeftPts = null;        // 剩余路线坐标（含当前位置投影点）
let navOnRoute = false;       // 是否正在导航（吃豆人模式激活）

function gpsMetersPerDegreeLat(){ return 111132.92; }
function gpsMetersPerDegreeLon(lat){ return 111412.84 * Math.cos(lat*Math.PI/180); }
function gpsToMap(lat,lon){
  const dx=(lon-GPS_MAP_CONFIG.longitude)*gpsMetersPerDegreeLon(lat);
  const dy=(GPS_MAP_CONFIG.latitude-lat)*gpsMetersPerDegreeLat();
  return {
    x:GPS_MAP_CONFIG.mapAnchorX + dx/GPS_MAP_CONFIG.metersPerPixel,
    y:GPS_MAP_CONFIG.mapAnchorY + dy/GPS_MAP_CONFIG.metersPerPixel
  };
}
function showGpsStatus(text,ms=3000){
  const el=$("gps-status"); if(!el)return;
  el.textContent=text;
  el.classList.add("show");
  clearTimeout(el._tm);
  // 3 秒后自动淡出（opacity 过渡），不切换 display，保证淡出动画可看
  if(ms>0) el._tm=setTimeout(()=>{ el.classList.remove("show"); }, ms);
}
function gpsError(err){
  const msg = err && err.code===1 ? "请允许浏览器使用定位权限" : (err && err.code===2 ? "暂时无法获取GPS位置" : "GPS定位超时，请到室外再试");
  showGpsStatus(msg,3000);
  // 失败保持黄色（loc-wait）
  const b=$("loc-btn2"); if(b) b.classList.add("loc-wait");
}
function startGPS(){
  if(!navigator.geolocation){ showGpsStatus("此浏览器不支持GPS定位",3000); return; }
  if(gpsWatchId!==null){
    navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId=null;
  }
  const b=$("loc-btn2"); if(b) b.classList.add("loc-wait");
  gpsPendingFirstFix=true; // 本次点击：等首次成功回调做一次性动作
  showGpsStatus("正在获取当前位置…",0);
  gpsWatchId=navigator.geolocation.watchPosition(onGPSPosition,gpsError,{
    enableHighAccuracy:true, maximumAge:1500, timeout:12000
  });
}
function centerOnGPS(){
  if(!gpsPoint || !data || !readyImg) return;
  const v=$("viewport");
  const cx=mapCx(), cy=mapCy();
  const rad=rot*Math.PI/180, cos=Math.cos(rad), sin=Math.sin(rad);
  const rx=(gpsPoint.x-cx)*scale, ry=(gpsPoint.y-cy)*scale;
  const rxr=rx*cos-ry*sin, ryr=rx*sin+ry*cos;
  tx=v.clientWidth/2-rxr;
  ty=v.clientHeight/2-ryr;
  const el=$("transform");
  el.classList.add("animate");
  applyTransform();
  clearTimeout(el._gpsAnimTm);
  el._gpsAnimTm=setTimeout(()=>el.classList.remove("animate"),450);
}

function onGPSPosition(pos){
  const c=pos.coords;
  const p=gpsToMap(c.latitude,c.longitude);
  gpsPoint={x:p.x,y:p.y,lat:c.latitude,lon:c.longitude,accuracy:Number(c.accuracy)||0,time:Date.now()};
  gpsLastAccuracy=gpsPoint.accuracy;
  if(c.heading!=null && Number.isFinite(c.heading) && c.heading>=0) gpsHeading=c.heading;
  drawMyPos(gpsPoint.x, gpsPoint.y);
  // 仅“点击定位后的首次成功”做一次性动作：变蓝+居中+设起点+弹窗
  if(gpsPendingFirstFix){
    gpsPendingFirstFix=false;
    const b=$("loc-btn2"); if(b) b.classList.remove("loc-wait"); // 成功变蓝
    showGpsStatus(`定位成功 · 精度约 ${Math.round(gpsPoint.accuracy)} 米`,3000);
    centerOnGPS();
    setStartToNearestPlace();
  }
  // GPS已获取后，把当前位置作为起点；用户输入终点后可直接开始导航。
  if(gpsNavigating && ep){
    const now=Date.now();
    if(now-gpsLastRecalc>GPS_RECALC_MIN_MS){
      const routeDist=distanceToCurrentRoute(gpsPoint);
      if(routeDist>GPS_OFF_ROUTE_PX || !routeOptions.length){
        // 偏航：重新计算路线（会重画完整路线，吃豆人从头开始）
        gpsLastRecalc=now;
        calculateFromGPS(false);
      }
    }
    // 未偏航：吃豆人——按当前位置把走过的路线隐藏
    updateNavProgress();
  }
}
// ===== “我的位置”红色陀螺仪（替换自导航.html样式）：实心红圆 + 尖三角箭头，箭头指向设备朝向 =====
function drawMyPos(px, py){
  if(!data||!readyImg) return;
  if(px==null||py==null){ if(!gpsPoint) return; px=gpsPoint.x; py=gpsPoint.y; }
  const svg=$("svg");
  let g=svg.querySelector(".my-pos-g");
  if(!g){
    g=document.createElementNS("http://www.w3.org/2000/svg","g");
    g.setAttribute("class","my-pos-g");
    svg.appendChild(g);
  }
  g.innerHTML="";
  const x=px, y=py;
  const R=9, tip=16, half=7;
  // 精度范围圈（蓝色半透明，最底层）：半径 = accuracy 换算像素，限制最大 90px
  if(gpsPoint && gpsPoint.accuracy){
    const accR=Math.min(90, Math.max(8, gpsPoint.accuracy/METER_PER_PX));
    const accC=document.createElementNS("http://www.w3.org/2000/svg","circle");
    accC.setAttribute("cx",x);accC.setAttribute("cy",y);accC.setAttribute("r",accR);
    accC.setAttribute("fill","rgba(37,99,235,.12)");accC.setAttribute("stroke","rgba(37,99,235,.28)");accC.setAttribute("stroke-width","2");
    accC.setAttribute("pointer-events","none");
    g.appendChild(accC);
  }
  // 标签（“我的位置”文字，在精度圈之上；反旋转与其他地名标签统一，绕文字自身锚点）
  const t=document.createElementNS("http://www.w3.org/2000/svg","text");
  t.setAttribute("class","my-pos-label");
  t.setAttribute("data-lx",x);t.setAttribute("data-ly",y-18);
  t.setAttribute("x",x);t.setAttribute("y",y-18);t.setAttribute("text-anchor","middle");t.setAttribute("dominant-baseline","middle");
  t.setAttribute("font-size","14");t.setAttribute("font-weight","bold");t.setAttribute("fill","#e53935");t.setAttribute("stroke","#fff");t.setAttribute("stroke-width",4);t.setAttribute("paint-order","stroke");
  t.textContent="我的位置";
  g.appendChild(t);
  // 外凸尖三角（默认朝上=北）
  const arrow=document.createElementNS("http://www.w3.org/2000/svg","path");
  arrow.setAttribute("class","heading-arrow");
  arrow.setAttribute("data-cx",x);arrow.setAttribute("data-cy",y);
  const ay=y-R+1;
  arrow.setAttribute("d","M "+(x-half)+" "+ay+" L "+x+" "+(y-tip)+" L "+(x+half)+" "+ay+" Z");
  arrow.setAttribute("fill","#e53935");arrow.setAttribute("stroke","#fff");arrow.setAttribute("stroke-width","3");arrow.setAttribute("stroke-linejoin","round");
  arrow.setAttribute("pointer-events","none");
  g.appendChild(arrow);
  // 实心红圆（带白边）
  const circle=document.createElementNS("http://www.w3.org/2000/svg","circle");
  circle.setAttribute("cx",x);circle.setAttribute("cy",y);circle.setAttribute("r",R);
  circle.setAttribute("fill","#e53935");circle.setAttribute("stroke","#fff");circle.setAttribute("stroke-width","3");
  circle.setAttribute("pointer-events","none");
  g.appendChild(circle);
  // 圆心小白点（最顶层）
  const white=document.createElementNS("http://www.w3.org/2000/svg","circle");
  white.setAttribute("cx",x);white.setAttribute("cy",y);white.setAttribute("r",3.4);
  white.setAttribute("fill","#fff");white.setAttribute("pointer-events","none");
  g.appendChild(white);
  svg.appendChild(g);
  refreshLabelRotation();
  updateHeadingArrow();
}
// 监听设备朝向（罗盘）
function initHeading(){
  try{ window.addEventListener('deviceorientationabsolute', onDeviceOrient, true); }catch(e){}
  window.addEventListener('deviceorientation', onDeviceOrient, true);
}
function onDeviceOrient(ev){
  let h=null, isIOS=false;
  if(typeof ev.webkitCompassHeading==='number' && ev.webkitCompassHeading>=0){ h=ev.webkitCompassHeading; isIOS=true; } // iOS：0=北，顺时针
  else if(typeof ev.alpha==='number' && ev.alpha!=null){ h=ev.alpha; } // Android：0=北，逆时针
  if(h!=null && isFinite(h)){
    // 统一成“顺时针、0=北”的屏幕朝向角（iOS 本身就是顺时针；Android alpha 是逆时针，需取负）
    if(isIOS){ deviceHeading = ((h%360)+360)%360; }
    else { deviceHeading = ((-h%360)+360)%360; }
    updateHeadingArrow();
  }
}
function updateHeadingArrow(){
  const g=$("svg")?.querySelector(".my-pos-g");
  const arrow=g?.querySelector(".heading-arrow");
  if(!arrow || deviceHeading==null) return;
  const r=(typeof rot==='number'?rot:0);
  // 屏幕朝北基准：箭头初始朝上=北(SVG负Y)。地图层已按 CSS rotate(r)(屏幕顺时针) 旋转。
  // SVG 的 rotate() 逆时针为正，因此要抵消 r 得到屏幕真实朝向 deviceHeading，
  // 需满足 屏幕角度 = r - svgAngle ，令其 = deviceHeading => svgAngle = r - deviceHeading。
  const angle=r-deviceHeading;
  const cx=parseFloat(arrow.getAttribute("data-cx"));
  const cy=parseFloat(arrow.getAttribute("data-cy"));
  arrow.setAttribute("transform","rotate("+angle+" "+cx+" "+cy+")");
}
function renderGpsMarker(){
  // 兼容旧调用：统一走红色陀螺仪
  drawMyPos();
}
function distanceToCurrentRoute(p){
  if(!data)return Infinity;
  // 优先用吃豆人导航保存的完整路线坐标（已有正确的 [x,y]）
  let pts=navFullPts;
  if(!pts || !pts.length){
    if(!routeOptions.length||selectedRouteIndex<0)return Infinity;
    const r=routeOptions[selectedRouteIndex]; const nm=nodeMap();
    pts=[];
    if(curS&&curS.node) pts.push([curS.node.x,curS.node.y]);
    for(const id of r.path){const n=nm.get(id);if(n)pts.push([n.x,n.y]);}
    if(curE&&curE.node) pts.push([curE.node.x,curE.node.y]);
  }
  if(pts.length<2) return Infinity;
  let best=Infinity;
  for(let i=0;i<pts.length-1;i++){
    const q=projectPointToSegment(p.x,p.y,pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1]);
    best=Math.min(best,Math.hypot(p.x-q.x,p.y-q.y));
  }
  return best;
}
// 吃豆人：根据当前位置把已走过的路线“吃掉”，只保留剩余路线（从当前位置投影点开始）
function updateNavProgress(){
  if(!navOnRoute || !navFullPts || navFullPts.length<2 || !gpsPoint || !data || !readyImg) return;
  const P=gpsPoint;
  // 找当前位置在完整路线折线上的最近投影点及其所在段的索引
  let bestQ=null, bestIdx=0, bd=Infinity;
  for(let i=0;i<navFullPts.length-1;i++){
    const a=navFullPts[i], b=navFullPts[i+1];
    const q=projectPointToSegment(P.x, P.y, a[0], a[1], b[0], b[1]);
    const d=Math.hypot(P.x-q.x, P.y-q.y);
    if(d<bd){ bd=d; bestQ=q; bestIdx=i; }
  }
  if(!bestQ) return;
  // 剩余路线 = [投影点] + 投影段末尾(b)之后的所有点
  const remaining=[[Math.round(bestQ.x), Math.round(bestQ.y)]];
  for(let j=bestIdx+1; j<navFullPts.length; j++){
    remaining.push(navFullPts[j]);
  }
  // 去重（投影点若与下一段起点重合则保留一次）
  const clean=[];
  for(const p of remaining){ const last=clean[clean.length-1]; if(!last||last[0]!==p[0]||last[1]!==p[1]) clean.push(p); }
  navLeftPts=clean;
  const ptsStr=clean.map(p=>p.join(",")).join(" ");
  // 更新三条 polyline
  const svg=$("svg");
  const casing=svg?.querySelector(".route-casing"); if(casing) casing.setAttribute("points", ptsStr);
  const route=svg?.querySelector(".route"); if(route) route.setAttribute("points", ptsStr);
  const arrow=svg?.querySelector(".route-arrow"); if(arrow) arrow.setAttribute("points", ptsStr);
}
function setStartToGPS(){
  if(!gpsPoint){ startGPS(); return false; }
  setStartToNearestPlace();
  return true;
}
// 起点自动设为“我的位置(最近地点+附近)”——每次点击定位都这样
function setStartToNearestPlace(){
  if(!gpsPoint || !data) return;
  const s=$("start"); if(!s) return;
  let nearest=null, bd=Infinity;
  for(const p of data.places){
    const d=Math.hypot(p.x-gpsPoint.x, p.y-gpsPoint.y);
    if(d<bd){ bd=d; nearest=p; }
  }
  if(nearest) s.value='我的位置('+nearest.name+'·附近)';
  else s.value='我的位置';
}
function calculateFromGPS(auto=false){
  if(!gpsPoint){ showGpsStatus("还没有获取到GPS位置",2500); startGPS(); return; }
  if(!$("end").value.trim()){ showGpsStatus("请先选择终点",2500); return; }
  setStartToNearestPlace();
  gpsNavigating=true;
  calculate();
}


// ===== 缩放/平移/旋转状态 =====
// 变换统一为：translate(tx,ty) rotate(rot) scale(scale) translate(-cx,-cy)
// 其中 (cx,cy) 恒为地图中心 (mapW/2, mapH/2)。旋转/缩放都围绕地图中心，简单且不会飞。
let scale=1, tx=0, ty=0;
let rot=0;
let baseScale=1;
const MIN_SCALE=0.1, MAX_SCALE=8;

// 地图逻辑尺寸（加载后由 naturalWidth/Height 赋值）
let mapW=0, mapH=0;
// 主连通分量（最大的节点集合），用于吸附时排除孤岛节点
let mainComponent=null;
// LOD：缩略图/高清图切换状态
let useLowRes=false;
const LOD_LOW=0.85;   // scale 低于此值切到缩略图
const LOD_HIGH=1.15;  // scale 高于此值切到高清图（迟滞区间避免反复横跳）
let inited=false;     // 地图尺寸是否已初始化（LOD 切图时防止重复初始化）
// 地图中心（旋转/缩放中心）
function mapCx(){ return mapW/2; }
function mapCy(){ return mapH/2; }

function applyTransform(){
  clampTransform();
  updateLOD();
  const el=$("transform");
  el.style.transformOrigin = "0 0";
  const cx=mapCx(), cy=mapCy();
  el.style.transform =
    `translate(${tx}px,${ty}px) rotate(${rot}deg) scale(${scale}) translate(${-cx}px,${-cy}px)`;
  refreshLabelRotation();
  renderScalebar();
  updateCompass();
  updateHeadingArrow();
}

// LOD 已停用（缩略图切换会引入切图闪 + 阈值对不上）。只显示高清图，从别处解决闪烁。
function updateLOD(){
  return;
}

// 罗盘：外圈（东南西北位置）随地图旋转，但每个字反向转保持正着（不歪）
function updateCompass(){
  const compass=$("compass");
  if(!compass) return;
  const ring=compass.querySelector(".cp-ring");
  if(ring) ring.style.transform = `rotate(${rot}deg)`;
  // 每个方向字：先保持定位（translate），再绕自身中心反向旋转保持正立
  const n=$("compass")?.querySelector(".cp-n"); if(n) n.style.transform=`translateX(-50%) rotate(${-rot}deg)`;
  const s=$("compass")?.querySelector(".cp-s"); if(s) s.style.transform=`translateX(-50%) rotate(${-rot}deg)`;
  const e=$("compass")?.querySelector(".cp-e"); if(e) e.style.transform=`translateY(-50%) rotate(${-rot}deg)`;
  const w=$("compass")?.querySelector(".cp-w"); if(w) w.style.transform=`translateY(-50%) rotate(${-rot}deg)`;
}

// 边界限制已关闭
function clampTransform(){
  return;
}

// 缓存地名标签引用与坐标，避免每次手势都 querySelectorAll（闪烁主因）
let labelCache=null;
function refreshLabelRotation(){
  if(!data||!readyImg) return;
  if(!labelCache){
    labelCache=Array.from(document.querySelectorAll("#svg .place-label")).map(t=>({
      el:t, x:parseFloat(t.getAttribute("x")), y:parseFloat(t.getAttribute("y"))
    }));
  }
  for(const L of labelCache){
    if(rot) L.el.setAttribute("transform",`rotate(${-rot} ${L.x} ${L.y})`);
    else L.el.removeAttribute("transform");
  }
  // “我的位置”标签：与地名标签用相同的反旋转逻辑（绕文字自身锚点）
  const myLabel=$("svg")?.querySelector(".my-pos-label");
  if(myLabel){
    const mx=parseFloat(myLabel.getAttribute("data-lx"));
    const my=parseFloat(myLabel.getAttribute("data-ly"));
    if(isFinite(mx) && isFinite(my)){
      if(rot) myLabel.setAttribute("transform",`rotate(${-rot} ${mx} ${my})`);
      else myLabel.removeAttribute("transform");
    }
  }
}
// 地名重绘后需重建缓存
function invalidateLabelCache(){ labelCache=null; }

function zoomAt(cx,cy,newScale){
  newScale=Math.max(MIN_SCALE,Math.min(MAX_SCALE,newScale));
  const k=newScale/scale;
  // 围绕屏幕点(cx,cy)缩放：tx/ty 是地图中心在屏幕上的位置
  tx = cx - k*(cx-tx);
  ty = cy - k*(cy-ty);
  scale=newScale;
  applyTransform();
}

// 屏幕坐标 -> 地图坐标（逆变换），旋转中心为地图中心
function screenToMap(sx, sy){
  const cx=mapCx(), cy=mapCy();
  const dx=sx-tx, dy=sy-ty;
  const rad=-rot*Math.PI/180;
  const cos=Math.cos(rad), sin=Math.sin(rad);
  const rx=dx*cos - dy*sin;
  const ry=dx*sin + dy*cos;
  return { x: cx + rx/scale, y: cy + ry/scale };
}

// —— 触摸手势：单指拖拽 + 双指缩放/旋转 ——
let pointers=new Map();
let lastDist=0, lastMid={x:0,y:0}, lastAngle=0;

$("viewport").addEventListener('pointerdown',e=>{
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  $("transform").classList.remove("animate");
  // 点击地图（不在搜索框/联想框内）时，底部导航栏滑回
  const tgt=e.target;
  if(!(tgt&&(tgt.id==='loc-input'||tgt.id==='loc-btn'||tgt.closest('#loc-suggest')))){
    const bb=$("bottombar"); if(bb){ bb.style.transition=''; bb.classList.remove("dock-out"); }
    const inp=$("loc-input"); if(inp){ try{inp.blur()}catch{} }
  }
  if(pointers.size===1){
    // 单指
  }else if(pointers.size===2){
    const pts=[...pointers.values()];
    lastDist=Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    lastMid={x:(pts[0].x+pts[1].x)/2, y:(pts[0].y+pts[1].y)/2};
    lastAngle=Math.atan2(pts[1].y-pts[0].y, pts[1].x-pts[0].x);
  }
});

$("viewport").addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return;
  const prev=pointers.get(e.pointerId);
  const dx=e.clientX-prev.x, dy=e.clientY-prev.y;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(pointers.size===1){
    // 单指拖拽平移
    tx+=dx; ty+=dy;
    applyTransform();
  }else if(pointers.size===2){
    const pts=[...pointers.values()];
    const d=Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    const mid={x:(pts[0].x+pts[1].x)/2, y:(pts[0].y+pts[1].y)/2};
    const ang=Math.atan2(pts[1].y-pts[0].y, pts[1].x-pts[0].x);
    // 双指缩放：围绕两指中点（保持中点对应地图点不动）
    if(lastDist>0 && d>0){
      const ns=Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale*(d/lastDist)));
      const m=screenToMap(mid.x, mid.y);
      const cx=mapCx(), cy=mapCy();
      const rad=rot*Math.PI/180;
      const cos=Math.cos(rad), sin=Math.sin(rad);
      // 地图中心相对锚点的偏移
      const ox=(cx-m.x), oy=(cy-m.y);
      scale=ns;
      // 让锚点 m 保持映射到屏幕 mid：tx = mid - R(rot)*S*(m - center)
      const rx=(m.x-cx)*ns, ry=(m.y-cy)*ns;
      const rxr=rx*cos - ry*sin, ryr=rx*sin + ry*cos;
      tx=mid.x - rxr;
      ty=mid.y - ryr;
    }
    // 双指旋转：围绕两指中点
    if(lastAngle!==null){
      let da=ang-lastAngle;
      while(da>Math.PI) da-=2*Math.PI;
      while(da<-Math.PI) da+=2*Math.PI;
      if(Math.abs(da)>0.005){
        const m=screenToMap(mid.x, mid.y);
        const cx=mapCx(), cy=mapCy();
        rot += da*180/Math.PI;
        const rad=rot*Math.PI/180;
        const cos=Math.cos(rad), sin=Math.sin(rad);
        const rx=(m.x-cx)*scale, ry=(m.y-cy)*scale;
        const rxr=rx*cos - ry*sin, ryr=rx*sin + ry*cos;
        tx=mid.x - rxr;
        ty=mid.y - ryr;
      }
    }
    lastDist=d; lastMid=mid; lastAngle=ang;
    applyTransform();
  }
});

function endPointer(e){
  pointers.delete(e.pointerId);
  lastDist=0;
  if(pointers.size===0) $("transform").classList.remove("animate");
}
$("viewport").addEventListener('pointerup',endPointer);
$("viewport").addEventListener('pointercancel',endPointer);
$("viewport").addEventListener('pointerleave',e=>{ if(pointers.has(e.pointerId)) endPointer(e); });

// 鼠标滚轮缩放（桌面）
$("viewport").addEventListener('wheel',e=>{
  e.preventDefault();
  const r=$("viewport").getBoundingClientRect();
  zoomAt(e.clientX-r.left, e.clientY-r.top, scale*(e.deltaY<0?1.15:0.87));
},{passive:false});

function resetView(silent){
  scale=baseScale; rot=0;
  // 复位时让地图居中：地图中心对准视口中心
  const vw=$("viewport").clientWidth, vh=$("viewport").clientHeight;
  tx=vw/2;
  ty=vh/2;
  const el=$("transform");
  if(silent){
    // 初始化时瞬时定位，不加过渡动画，避免多次 reset 叠加导致打开时闪烁
    el.classList.remove("animate"); clearTimeout(el._animTm);
    applyTransform();
    return;
  }
  // 复位时加过渡动画
  el.classList.add("animate");
  applyTransform();
  clearTimeout(el._animTm);
  el._animTm=setTimeout(()=>el.classList.remove("animate"), 550);
}

$("imgFile").onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  if(imgURL)URL.revokeObjectURL(imgURL);
  imgURL=URL.createObjectURL(f);
  $("map").src=imgURL;
};
$("map").onload=()=>{
  readyImg=true;
  $("wrap").hidden=false;
  // 尺寸初始化只做一次（用高清图尺寸），LOD 切图时不重复初始化，避免死循环
  if(!inited){
    inited=true;
    const w=$("map").naturalWidth,h=$("map").naturalHeight;
    mapW=w; mapH=h;
    $("wrap").style.width=w+"px";$("wrap").style.height=h+"px";
    $("svg").setAttribute("width",w);$("svg").setAttribute("height",h);
    // 自动适配：初始默认放大到校园局部（非整图），用户可再缩放
    const vw=$("viewport").clientWidth, vh=$("viewport").clientHeight;
    const fit=Math.min(vw/w, vh/h);
    baseScale=fit*2.2;
    baseScale=Math.max(MIN_SCALE, Math.min(MAX_SCALE, baseScale));
    resetView(true);
    $("wrap").hidden=false;
  }
  // 地图就绪后统一渲染（此时 data 可能已加载或稍后加载，renderIfReady 会兜底）
  renderIfReady();
  // iframe 首次加载时视口尺寸可能尚未定型，多次延迟居中，确保地图不偏左上角（静默定位，不触发过渡动画）
  [100, 300, 600].forEach((ms)=>{
    setTimeout(()=>{ if(inited) resetView(true); }, ms);
  });
};

function loadJSONText(txt){
  try{
    const d=JSON.parse(txt);
    if(!Array.isArray(d.places)||!Array.isArray(d.nodes)||!Array.isArray(d.edges))
      throw new Error("不是 V4 campus_map.json 格式");
    data=d;
    computeMainComponent();
    fillPlaces();
    renderIfReady();
  }catch(err){
    console.warn("数据加载失败", err.message);
  }
}

// 统一就绪渲染：地图图片和 JSON 数据都加载完成后，再完整渲染一次，
// 避免时序竞争导致地标/文字漏渲染
function renderIfReady(){
  if(readyImg && data) renderBase();
}

$("jsonFile").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ loadJSONText(r.result); e.target.value=""; };
  r.readAsText(f,"utf-8");
};

function autoLoad(){
  // 优先读取页面内联数据（单文件方案，file:// 与 GitHub Pages 均可用）
  const inline=document.getElementById("mapdata");
  if(inline && inline.textContent && inline.textContent.trim()){
    loadJSONText(inline.textContent);
  } else {
    // 兜底：仍尝试从外部 JSON 加载
    fetch('campus_map.json',{cache:'no-store'})
      .then(r=>{ if(!r.ok) throw new Error('json 404'); return r.text(); })
      .then(txt=>{ loadJSONText(txt); })
      .catch(()=>{/* 等手动导入 */});
  }
  const img=new Image();
  img.onload=()=>{ imgURL='campus.webp'; $("map").src='campus.webp'; };
  img.onerror=()=>{ /* 图片加载失败时仍显示画布 */ };
  img.src='campus.webp';
}

// 汉字串 → 拼音首字母串（无法映射的字保留原字）
function toPinyinInitials(s){
  let out='';
  for(const ch of s){
    out += PY_INIT[ch] || ch;
  }
  return out;
}

// 生成某段文本的所有“可匹配变体”（用于 3=三 这种同义联想）
function genVariants(s){
  const v=new Set([s]);
  // 数字 ↔ 中文数字
  let replaced='';
  for(const ch of s){
    if(CN_NUM[ch]) replaced+=CN_NUM[ch];
    else if(AR_NUM[ch]) replaced+=AR_NUM[ch];
    else replaced+=ch;
  }
  if(replaced!==s) v.add(replaced);
  return [...v];
}

// 把输入转换为正式地点名（命中别名则返回正式名）
function aliasToName(q){
  if(!q) return q;
  for(const [a,b] of ALIAS){
    if(q===a || q.toLowerCase()===a.toLowerCase()) return b;
  }
  return q;
}

// 判断地名是否匹配输入（支持连续包含 + 非连续子序列 + 同义 + 拼音首字母 + 别名）
function matchPlace(name, query){
  const q=query.toLowerCase();
  // 0) 别名：若输入命中别名且指向本地点，直接匹配
  const aliasName=aliasToName(query);
  if(aliasName!==query && name.toLowerCase()===aliasName.toLowerCase()) return true;
  // 1) 直接包含 / 数字中文变体
  const variants=genVariants(name);
  for(const v of variants){
    if(v.toLowerCase().includes(q)) return true;
  }
  // 2) 拼音首字母匹配：输入全为字母时
  const py=toPinyinInitials(name).toLowerCase();
  if(py.includes(q)) return true;
  // 3) 非连续子序列匹配：查询每个字按顺序出现在地名中（中间可隔字）
  //    例如“大活”可匹配“大学生活动中心”
  return isSubsequence(q, name.toLowerCase());
}

// 判断 q 是否为 s 的子序列（字符按顺序出现，可跳过中间字符）
function isSubsequence(q, s){
  let i=0;
  for(let j=0; j<s.length && i<q.length; j++){
    if(s[j]===q[i]) i++;
  }
  return i===q.length;
}

// 在名称中找出要标蓝的区间（返回区间数组 [[s,e],...]，支持非连续子序列多点标蓝）
function findHighlight(name, query){
  const q=query.toLowerCase();
  const variants=genVariants(name);
  // 1) 连续包含 / 数字变体匹配
  for(const v of variants){
    const idx=v.toLowerCase().indexOf(q);
    if(idx>=0 && v.length===name.length) return [[idx, idx+q.length]];
  }
  // 2) 拼音首字母匹配：定位对应的汉字区间
  const py=toPinyinInitials(name).toLowerCase();
  const pidx=py.indexOf(q);
  if(pidx>=0) return [[pidx, pidx+q.length]];
  // 3) 非连续子序列匹配：每个匹配字的区间分别标蓝
  const ranges=subseqRanges(q, name.toLowerCase());
  if(ranges) return ranges;
  // 默认：直接找原始名称
  const idx=name.toLowerCase().indexOf(q);
  if(idx>=0) return [[idx, idx+q.length]];
  return null;
}

// 找 q 作为 s 子序列时每个字符的位置（返回区间数组）
function subseqRanges(q, s){
  const ranges=[];
  let i=0;
  for(let j=0; j<s.length && i<q.length; j++){
    if(s[j]===q[i]){
      ranges.push([j, j+1]);
      i++;
    }
  }
  return i===q.length ? ranges : null;
}

// 高亮：拼接 HTML，把多个区间标蓝
function highlightName(name, ranges){
  if(!ranges || !ranges.length) return esc(name);
  let html='', last=0;
  for(const [s,e] of ranges){
    html += esc(name.slice(last, s)) + '<mark>'+esc(name.slice(s, e))+'</mark>';
    last = e;
  }
  html += esc(name.slice(last));
  return html;
}

function setupSuggest(input, box){
  let activeIdx=-1;

  function render(){
    const q=input.value.trim();
    if(!q || !data){ box.classList.remove("show"); return; }
    const matches=data.places.filter(p=>matchPlace(p.name, q));
    if(!matches.length){ box.innerHTML='<div class="empty">无匹配地点</div>'; box.classList.add("show"); return; }
    box.innerHTML="";
    matches.forEach((p,i)=>{
      const div=document.createElement("div");
      div.className="item"+(i===activeIdx?" active":"");
      const rg=findHighlight(p.name, q);
      div.innerHTML='<span class="dot"></span><span>'+highlightName(p.name, rg)+'</span>';
      div.onmousedown=e=>{ e.preventDefault(); input.value=p.name; box.classList.remove("show"); };
      box.appendChild(div);
    });
    box.classList.add("show");
  }

  input.addEventListener("input",()=>{ activeIdx=-1; render(); });
  input.addEventListener("focus",()=>{ render(); });
  input.addEventListener("blur",()=>{ setTimeout(()=>box.classList.remove("show"),150); });
  // 阻止弹窗内的滚动手势穿透到底层地图，保证联想列表能独立滑动
  box.addEventListener("touchmove",e=>{ e.stopPropagation(); }, {passive:true});
  box.addEventListener("wheel",e=>{ e.stopPropagation(); });
  input.addEventListener("keydown",e=>{
    if(!box.classList.contains("show")) return;
    const items=box.querySelectorAll(".item");
    if(!items.length) return;
    if(e.key==="ArrowDown"){ e.preventDefault(); activeIdx=(activeIdx+1)%items.length; }
    else if(e.key==="ArrowUp"){ e.preventDefault(); activeIdx=(activeIdx-1+items.length)%items.length; }
    else if(e.key==="Enter"){ e.preventDefault(); const t=items[activeIdx>=0?activeIdx:0]; if(t) input.value=t.textContent.replace(/^\s*●?\s*/,'').trim(); box.classList.remove("show"); return; }
    else return;
    items.forEach((el,i)=>el.classList.toggle("active",i===activeIdx));
  });
}

function resolvePlace(inputVal){
  if(!data||!inputVal) return null;
  const t=String(inputVal).trim();
  if(!t) return null;
  if((t==="我的当前位置" || t.indexOf("我的位置")===0) && gpsPoint){
    return {id:"__gps__", name:"我的位置", x:gpsPoint.x, y:gpsPoint.y, type:"gps", note:"GPS实时位置"};
  }
  let p=data.places.find(x=>x.name===t);
  if(p) return p;
  const hits=data.places.filter(x=>x.name.includes(t));
  if(hits.length===1) return hits[0];
  const byId=data.places.find(x=>String(x.id)===t);
  return byId||null;
}

// ===== 图论 =====
function nodeMap(){ const m=new Map(); data.nodes.forEach(n=>m.set(n.id,n)); return m; }

// 计算最大连通分量（主路网），用于吸附时排除孤岛节点
function computeMainComponent(){
  if(!data) return;
  const g=graph();
  const allIds=data.nodes.map(n=>n.id);
  const seen=new Set();
  let best=null;
  for(const id of allIds){
    if(seen.has(id)) continue;
    const comp=new Set();
    const stack=[id];
    seen.add(id);
    while(stack.length){
      const cur=stack.pop();
      comp.add(cur);
      for(const e of (g.get(cur)||[])){
        if(!seen.has(e.id)){ seen.add(e.id); stack.push(e.id); }
      }
    }
    if(!best || comp.size>best.size) best=comp;
  }
  mainComponent=best;
}

function graph(){
  const g=new Map();
  data.nodes.forEach(n=>g.set(n.id,[]));
  data.edges.forEach(e=>{
    const a=g.get(e.from),b=g.get(e.to);
    if(!a||!b)return;
    let d=Number(e.distance);
    if(!Number.isFinite(d)||d<=0){
      const nm=nodeMap(),n1=nm.get(e.from),n2=nm.get(e.to);
      d=Math.hypot(n1.x-n2.x,n1.y-n2.y);
    }
    a.push({id:e.to,cost:d});
    b.push({id:e.from,cost:d});
  });
  return g;
}

// 计算点到线段(ax,ay)-(bx,by)的最近投影点（含线段端点约束），返回投影点坐标
function projectPointToSegment(px, py, ax, ay, bx, by){
  const dx=bx-ax, dy=by-ay;
  const len2=dx*dx+dy*dy;
  if(len2<1e-9) return {x:ax,y:ay};
  let t=((px-ax)*dx+(py-ay)*dy)/len2;
  t=Math.max(0,Math.min(1,t));
  return {x:ax+t*dx, y:ay+t*dy};
}

// 吸附：把点投影到最近的道路「边」的线段上，返回边的任意一点（而非仅节点）
function nearestEdgePoint(p){
  if(!data || !data.edges || !data.nodes) return null;
  const nm=nodeMap();
  let best=null, bd=Infinity;
  for(const e of data.edges){
    const a=nm.get(e.from), b=nm.get(e.to);
    if(!a||!b) continue;
    // 排除孤岛边（任一端不在主连通分量内）
    if(mainComponent && (!mainComponent.has(a.id) || !mainComponent.has(b.id))) continue;
    const proj=projectPointToSegment(p.x, p.y, a.x, a.y, b.x, b.y);
    const d=Math.hypot(p.x-proj.x, p.y-proj.y);
    if(d<bd){ bd=d; best={x:proj.x, y:proj.y, edge:e, a:a, b:b}; }
  }
  return best;
}

function nearestNode(place, toward=null){
  let best=null,bd=Infinity;
  for(const n of data.nodes){
    // 跳过孤岛节点（不在主连通分量里的节点），避免吸附到无法连通路网的孤岛
    if(mainComponent && !mainComponent.has(n.id)) continue;
    const d=Math.hypot(place.x-n.x,place.y-n.y);
    let score=d;
    if(toward){
      const vx=n.x-place.x, vy=n.y-place.y;      // 指向候选节点
      const tx=toward.x-place.x, ty=toward.y-place.y; // 指向终点
      const dot=vx*tx+vy*ty;
      const vl=Math.hypot(vx,vy), tl=Math.hypot(tx,ty);
      if(vl>1e-6 && tl>1e-6){
        const cos=Math.max(-1,Math.min(1,dot/(vl*tl)));
        // 线性方向惩罚：dev=(1-cos)/2，同向0、垂直0.5、背向1。
        // 权重 3.0 时，偏离目标方向的“侧后方”点会被明显抬高，
        // 从而更坚决地选朝向目标方向的节点，避免路线开头就拐错方向。
        const dev = (1 - cos) / 2;
        score = d * (1 + SNAP_DIR_WEIGHT * dev);
      }
    }
    if(score<bd){bd=score;best=n}
  }
  let dist=0;
  if(best) dist=Math.hypot(place.x-best.x, place.y-best.y);
  return {node:best, distance:dist};
}

function heuristic(a,b,nodes){
  const x=nodes.get(a),y=nodes.get(b);
  return x&&y?Math.hypot(x.x-y.x,x.y-y.y):0;
}

function stepCost(g,nodes,cur,e,prev){
  let step=e.cost;
  if(prev){
    const pn=nodes.get(prev), cn=nodes.get(cur), nn=nodes.get(e.id);
    if(pn&&cn&&nn){
      const v1x=cn.x-pn.x, v1y=cn.y-pn.y;
      const v2x=nn.x-cn.x, v2y=nn.y-cn.y;
      const l1=Math.hypot(v1x,v1y), l2=Math.hypot(v2x,v2y);
      if(l1>1e-6 && l2>1e-6){
        const cos=Math.max(-1,Math.min(1,(v1x*v2x+v1y*v2y)/(l1*l2)));
        const ang=Math.acos(cos);
        step += TURN_PENALTY * (ang/Math.PI);
      }
    }
  }
  return step;
}

function shortestPath(g,startId,goalId,removedEdges,removedNodes){
  const nodes=nodeMap();
  const open=new Set([startId]);
  const came=new Map();
  const gs=new Map([[startId,0]]);
  const fs=new Map([[startId,heuristic(startId,goalId,nodes)]]);
  while(open.size){
    let cur=null,best=Infinity;
    for(const id of open){ const f=fs.get(id)??Infinity; if(f<best){best=f;cur=id} }
    if(cur===goalId){
      const path=[cur];
      while(came.has(cur)){cur=came.get(cur);path.push(cur)}
      path.reverse();
      return {path,distance:gs.get(goalId)};
    }
    open.delete(cur);
    const prev=came.get(cur)??null;
    for(const e of (g.get(cur)||[])){
      if(removedEdges.has(edgeKey(cur,e.id)))continue;
      if(removedNodes.has(e.id)&&e.id!==goalId)continue;
      const tentative=(gs.get(cur)??Infinity)+stepCost(g,nodes,cur,e,prev);
      if(tentative<(gs.get(e.id)??Infinity)){
        came.set(e.id,cur);
        gs.set(e.id,tentative);
        fs.set(e.id,tentative+heuristic(e.id,goalId,nodes));
        open.add(e.id);
      }
    }
  }
  return null;
}

function findAlternativeRoutes(startId,goalId,k){
  const baseGraph=graph();
  const first=shortestPath(baseGraph,startId,goalId,new Set(),new Set());
  if(!first)return [];
  const A=[first], B=[];
  const seen=new Set([pathKey(first.path)]);
  for(let iter=1;iter<k;iter++){
    const prev=A[iter-1];
    for(let i=0;i<prev.path.length-1;i++){
      const root=prev.path.slice(0,i+1);
      const removedEdges=new Set();
      for(const p of A){
        if(p.path.length>i && pathPrefix(p.path,root))
          removedEdges.add(edgeKey(p.path[i],p.path[i+1]));
      }
      const removedNodes=new Set(root.slice(0,-1));
      const spur=shortestPath(baseGraph,root[root.length-1],goalId,removedEdges,removedNodes);
      if(!spur)continue;
      const fullPath=root.slice(0,-1).concat(spur.path);
      const key=pathKey(fullPath);
      if(seen.has(key))continue;
      const rootCost=pathDistance(root);
      B.push({path:fullPath,distance:rootCost+spur.distance});
      seen.add(key);
    }
    if(!B.length)break;
    B.sort((a,b)=>a.distance-b.distance);
    A.push(B.shift());
  }
  return A;
}

function pathDistance(path){
  const g=graph(); let total=0;
  for(let i=0;i<path.length-1;i++){
    const e=(g.get(path[i])||[]).find(x=>x.id===path[i+1]);
    if(e)total+=e.cost;
  }
  return total;
}
function edgeKey(a,b){ return String(a)<String(b)?String(a)+"_"+String(b):String(b)+"_"+String(a); }
function pathKey(p){return p.join(">")}
function pathPrefix(a,b){ if(a.length<b.length)return false; for(let i=0;i<b.length;i++)if(a[i]!==b[i])return false; return true; }

// ===== 路线计算与渲染 =====
function calculate(){
  if(!data||!readyImg)return toast("正在加载地图，请稍候…");
  sp = resolvePlace($("start").value);
  ep=resolvePlace($("end").value);
  vp=resolvePlace($("via").value);   // 途经点（可选）
  if(!sp||!ep)return toast("请正确输入起点和终点名称");
  if(sp.id===ep.id)return toast("起点和终点不能相同");
  if(vp && (vp.id===sp.id||vp.id===ep.id))return toast("途经点不能与起点或终点相同");
  $("end").value=ep.name;
  if(vp) $("via").value=vp.name;
  $("start").value=sp.name;
  // 若起点是“我的位置”（实时定位），进入 GPS 吃豆人导航模式
  if(sp && sp.type==='gps'){
    gpsNavigating=true;
  }

  const s=nearestNode(sp, ep), e=nearestNode(ep, sp);
  if(!s.node||!e.node)return toast("没有道路节点，无法导航");

  // 途经点吸附
  const v = vp ? nearestNode(vp, ep) : null;

  // 显示计算等待条（只在点击“开始导航”后显示）
  const calcEl=$("calcloading"); if(calcEl){ calcEl.classList.add("show"); }

  // 用短延迟体现“AI 计算中”，实际寻路是同步的瞬时完成
  setTimeout(()=>{
    let fullPath=null, totalDist=0;
    if(v && v.node){
      // 两段：起点→途经点，途经点→终点
      const seg1=findAlternativeRoutes(s.node.id, v.node.id, 1);
      const seg2=findAlternativeRoutes(v.node.id, e.node.id, 1);
      if(!seg1.length || !seg2.length){
        if(calcEl) calcEl.classList.remove("show");
        toast("无法到达：途经点未连通路网");
        return;
      }
      // 拼接两段（去重逢接口点）
      const p1=seg1[0].path;
      const p2=seg2[0].path.slice(1);
      fullPath=p1.concat(p2);
      totalDist = seg1[0].distance + seg2[0].distance + s.distance + v.distance + e.distance;
      routeOptions=[{path:fullPath, distance:seg1[0].distance+seg2[0].distance, totalDistance:totalDist}];
    }else{
      routeOptions=findAlternativeRoutes(s.node.id,e.node.id,1);
      routeOptions=routeOptions.map(r=>({...r,totalDistance:r.distance+s.distance+e.distance}));
    }

    if(calcEl) calcEl.classList.remove("show");

    if(!routeOptions.length){ toast("无法到达：路网未连通"); return; }

    selectedRouteIndex=0;
    chooseRoute(0,s,e,v);
    $("result-panel").classList.add("show");
    $("route-form").classList.add("collapsed");
  }, 700);
}

let curS=null,curE=null,curV=null;
function chooseRoute(index,s,e,v){
  curS=s; curE=e; curV=v;
  selectedRouteIndex=index;
  const r=routeOptions[index];
  drawRoute(r.path,s.node,e.node,v?.node||null);
  let title = `${esc(sp.name)} → ${esc(ep.name)}`;
  if(vp) title = `${esc(sp.name)} → ${esc(vp.name)} → ${esc(ep.name)}`;
  $("result").innerHTML=
    `<b style="color:var(--primary)">${title}</b><br>`+
    `全程约 <b>${fmtDist(r.totalDistance)}</b>（步行）<br>`+
    `途经 ${r.path.length} 个道路节点`;
}

function drawRoute(path,sn,en,vn){
  renderBase();
  const svg=$("svg");
  const nodes=nodeMap();
  const pts=[[sp.x,sp.y],[sn.x,sn.y]];
  path.forEach(id=>{const n=nodes.get(id);if(n)pts.push([n.x,n.y])});
  pts.push([en.x,en.y],[ep.x,ep.y]);
  const clean=[];
  for(const p of pts){ const last=clean[clean.length-1]; if(!last||last[0]!==p[0]||last[1]!==p[1])clean.push(p); }
  // 保存完整路线点（供吃豆人导航按当前位置裁剪）
  navFullPts=clean;
  navLeftPts=clean;
  navOnRoute=true;
  const points=clean.map(p=>p.join(",")).join(" ");
  // 底层白色描边（描边）
  const casing=document.createElementNS("http://www.w3.org/2000/svg","polyline");
  casing.setAttribute("points",points);
  casing.setAttribute("class","route-casing");
  svg.appendChild(casing);
  // 中层红色路径
  const poly=document.createElementNS("http://www.w3.org/2000/svg","polyline");
  poly.setAttribute("points",points);
  poly.setAttribute("class","route");
  svg.appendChild(poly);
  // 上层流动箭头条纹（白色虚线，沿路径方向动）
  const arrow=document.createElementNS("http://www.w3.org/2000/svg","polyline");
  arrow.setAttribute("points",points);
  arrow.setAttribute("class","route-arrow");
  svg.appendChild(arrow);
  [[sp,"#22c55e"],[ep,"#ef4444"]].forEach(([p,c])=>{
    const ci=document.createElementNS("http://www.w3.org/2000/svg","circle");
    ci.setAttribute("cx",p.x);ci.setAttribute("cy",p.y);ci.setAttribute("r",10);
    ci.setAttribute("fill",c);ci.setAttribute("stroke","#fff");ci.setAttribute("stroke-width","3");
    svg.appendChild(ci);
  });
  // 途经点标记（橙色）
  if(vp && vn){
    const ci=document.createElementNS("http://www.w3.org/2000/svg","circle");
    ci.setAttribute("cx",vp.x);ci.setAttribute("cy",vp.y);ci.setAttribute("r",10);
    ci.setAttribute("fill","#f59e0b");ci.setAttribute("stroke","#fff");ci.setAttribute("stroke-width","3");
    svg.appendChild(ci);
  }
  // 将地名文字提升到最顶层，避免被路线盖住
  bringLabelsToTop();
  renderGpsMarker();
  focusOnRoute(clean);
}

// 把地名标签和地标点重新 append 到 SVG 末尾，使其始终显示在路线之上
function bringLabelsToTop(){
  const svg=$("svg");
  if(!svg) return;
  const els=Array.from(svg.querySelectorAll(".place-label, .place-dot"));
  els.forEach(t=>svg.appendChild(t));
}

// 缩放/平移视图，使整条路线完整可见且居中
function focusOnRoute(pts){
  if(!pts.length) return;
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(const [x,y] of pts){
    if(x<minX)minX=x; if(x>maxX)maxX=x;
    if(y<minY)minY=y; if(y>maxY)maxY=y;
  }

  // 计算路线方向角（起点 -> 终点），规整到最近 90° 倍数，地图保持横平竖直
  // 结果限制在 -90 ~ 90 之间，永远不旋转到 180°/270°，避免地图颠倒
  const sx=pts[0][0], sy=pts[0][1];
  const ex=pts[pts.length-1][0], ey=pts[pts.length-1][1];
  const dx=ex-sx, dy=ey-sy;
  const curAngle=Math.atan2(dy,dx)*180/Math.PI;   // -180~180，0=右
  let rawRot = -90 - curAngle;                     // 让“起点->终点”方向朝上(-90)
  rot = Math.round(rawRot / 90) * 90;              // 规整到 90° 倍数
  // 限制在 [-90, 90]：如果算出来是 180 或 -180，等价于 0；±270 等价于 ∓90
  rot = ((rot % 360) + 360) % 360;                 // 0~360
  if(rot === 270) rot = -90;
  else if(rot === 180) rot = 0;

  const vw=$("viewport").clientWidth, vh=$("viewport").clientHeight;
  const padX=36, padTop=60, padBottom=110;
  const bw=Math.max(maxX-minX, 1), bh=Math.max(maxY-minY, 1);
  let s=Math.min((vw-padX*2)/bw, (vh-padTop-padBottom)/bh);
  // 聚焦缩放上限：两个地点很近时，也别放大过头
  const FOCUS_MAX=2.5;
  s=Math.max(MIN_SCALE, Math.min(FOCUS_MAX, s));
  scale=s;

  // 路线包围盒中心（地图坐标）
  const routeCx=(minX+maxX)/2;
  const routeCy=(minY+maxY)/2;

  // 目标：让路线中心映射到屏幕可用区域中心。
  // 变换：screen = translate(tx,ty) rotate(rot) scale(s) translate(-mapCenter)
  // 路线中心经变换后的屏幕位置 = (tx,ty) + R(rot)·S(s)·(routeCenter - mapCenter)
  const targetSx=vw/2;
  const targetSy=padTop + (vh-padTop-padBottom)/2;
  const cx=mapCx(), cy=mapCy();
  const rad=rot*Math.PI/180;
  const cos=Math.cos(rad), sin=Math.sin(rad);
  const rx=(routeCx-cx)*s, ry=(routeCy-cy)*s;
  const rxr=rx*cos - ry*sin, ryr=rx*sin + ry*cos;
  tx = targetSx - rxr;
  ty = targetSy - ryr;
  // 聚焦路线时加过渡动画
  const el=$("transform");
  el.classList.add("animate");
  applyTransform();
  clearTimeout(el._animTm);
  el._animTm=setTimeout(()=>el.classList.remove("animate"), 550);
}

// ===== 右上角地点搜索 + 确认放大 =====
// 搜索评分：让精确匹配/别名优先于子序列模糊匹配
function searchScore(name, query){
  const q=query.toLowerCase();
  const n=name.toLowerCase();
  if(!q) return 0;
  // 别名精确命中：最高分
  for(const [a,b] of ALIAS){
    if((q===a.toLowerCase()) && n===b.toLowerCase()) return 10000;
  }
  // 完全相等
  if(n===q) return 9000;
  // 直接包含：越靠前、越短越优
  const idx=n.indexOf(q);
  if(idx>=0) return 5000 - idx - name.length*0.1;
  // 前缀包含（“西”匹配所有西开头地点，但子序列会把它放大所以给较低分）
  if(n.startsWith(q)) return 3000 - name.length*0.1;
  // 拼音首字母
  const py=toPinyinInitials(name).toLowerCase();
  if(py.includes(q)) return 2000 - name.length*0.1;
  // 子序列（最低优先级）
  if(isSubsequence(q, n)) return 1000 - name.length*0.1;
  return 0;
}

// ===== 顶部地点搜索 + 确认放大 =====
function setupLocSearch(){
  const input=$("loc-input");
  const box=$("loc-suggest");
  if(!input||!box) return;
  let activeIdx=-1;

  // 搜索联想（与底部导航栏同一套 matchPlace 宽松匹配，列出全部相关结果）
  function render(){
    const q=input.value.trim();
    if(!q){ box.classList.remove("show"); return; }
    const matches=data.places.filter(p=>matchPlace(p.name, q));
    if(!matches.length){
      box.innerHTML='<div class="item">未找到地点</div>';
      box.classList.add("show");
      return;
    }
    box.innerHTML="";
    matches.forEach((p,i)=>{
      const div=document.createElement("div");
      div.className="item"+(i===activeIdx?" active":"");
      div.textContent=p.name;
      div.dataset.idx=i;
      div.addEventListener("click",()=>doGoto(p));
      box.appendChild(div);
    });
    box.classList.add("show");
  }

  function doGoto(p){
    input.value=p.name;
    gotoPlace(p);
    box.classList.remove("show");
    input.blur();
  }

  input.addEventListener("input",()=>{ activeIdx=-1; render(); });
  input.addEventListener("focus",()=>{
    render();
    // 聚焦搜索框时，底部导航栏和定位按钮立即移出（不等键盘弹起，避免被顶起来闪一下）
    const bb=$("bottombar"); if(bb){ bb.style.transition='none'; bb.classList.add("dock-out"); }
  });
  input.addEventListener("blur",()=>{
    setTimeout(()=>{ box.classList.remove("show"); },250);
  });
  box.addEventListener("touchmove",e=>e.stopPropagation(),{passive:true});
  box.addEventListener("wheel",e=>e.stopPropagation());
  input.addEventListener("keydown",e=>{
    const items=box.querySelectorAll(".item");
    if(items.length && e.key==="ArrowDown"){ e.preventDefault(); activeIdx=(activeIdx+1)%items.length; highlights(items); }
    else if(items.length && e.key==="ArrowUp"){ e.preventDefault(); activeIdx=(activeIdx-1+items.length)%items.length; highlights(items); }
    else if(e.key==="Enter"){
      e.preventDefault();
      if(items.length){
        const p=data.places.find(x=>x.name===items[activeIdx>=0?activeIdx:0].textContent);
        if(p) doGoto(p);
      } else {
        confirmGoto();
      }
    }
  });
  function highlights(items){
    items.forEach((el,i)=>el.classList.toggle("active",i===activeIdx));
  }

  $("loc-btn").addEventListener("click",confirmGoto);
  function confirmGoto(){
    const q=input.value.trim();
    if(!q) return;
    const target=resolvePlace(aliasToName(q));
    if(target){
      gotoPlace(target);
      box.classList.remove("show");
    } else {
      const hits=data.places.filter(p=>matchPlace(p.name, q));
      if(hits.length===1) gotoPlace(hits[0]);
      else box.classList.add("show");
    }
  }
}

// 放大地图到指定地点（复用 focusOnRoute 的坐标变换模型）
function gotoPlace(p){
  if(!p||!data||!readyImg||!mapW) return;
  const vw=$("viewport").clientWidth, vh=$("viewport").clientHeight;
  // 保持当前旋转，或复位为 0 保持正北朝上
  rot = 0;
  // 放大倍数：看清该地点但不过度放大
  const s = 1.2;
  scale = s;
  const cx=mapCx(), cy=mapCy();
  const rad=rot*Math.PI/180, cos=Math.cos(rad), sin=Math.sin(rad);
  const rx=(p.x-cx)*s, ry=(p.y-cy)*s;
  const rxr=rx*cos - ry*sin, ryr=rx*sin + ry*cos;
  tx = vw/2 - rxr;
  ty = vh/2 - ryr;
  const el=$("transform");
  el.classList.add("animate");
  applyTransform();
  clearTimeout(el._animTm);
  el._animTm=setTimeout(()=>el.classList.remove("animate"),550);
  // 手动搜索定位到某地点后，定位按钮回到黄色（表示不再是“实时定位”状态）
  const b=$("loc-btn2"); if(b) b.classList.add("loc-wait");
}

function fmtDist(px){
  const m=px*METER_PER_PX;
  if(m>=1000)return (m/1000).toFixed(2)+" 公里";
  return Math.round(m)+" 米";
}

// ===== 基础渲染（只显示地标，不显示底层路网）=====
function renderBase(){
  if(!data||!readyImg)return;
  const svg=$("svg");svg.innerHTML="";
  data.places.forEach(p=>{
    const g=document.createElementNS("http://www.w3.org/2000/svg","circle");
    g.setAttribute("cx",p.x);g.setAttribute("cy",p.y);g.setAttribute("r","7");g.setAttribute("class","place-dot");
    svg.appendChild(g);
    const t=document.createElementNS("http://www.w3.org/2000/svg","text");
    // 文字边界适配：靠近地图右边缘时文字放左边，否则放右边
    const labelLeft = p.x + 10;
    const labelRight = (mapW ? mapW : 2696) - 10;
    const anchor = (labelLeft > labelRight - 60) ? "end" : "start";
    const lx = anchor === "end" ? (p.x - 10) : labelLeft;
    t.setAttribute("x", lx);
    t.setAttribute("y", p.y + 4);
    t.setAttribute("text-anchor", anchor);
    t.setAttribute("class","place-label");
    t.textContent=p.name;
    svg.appendChild(t);
  });
  // 地名重绘后需重建反旋转缓存
  invalidateLabelCache();
  renderScalebar();
  renderGpsMarker();
}

function renderScalebar(){
  const sb=$("scalebar");
  if(!sb||!data||!readyImg)return;
  const niceMeters=[20,50,100,200,500,1000];
  const maxPx=120;
  let chosenM=200;
  for(const m of niceMeters){ if(m/METER_PER_PX<=maxPx) chosenM=m; else break; }
  let barPx=chosenM/METER_PER_PX;
  if(barPx>maxPx){ barPx=maxPx; chosenM=maxPx*METER_PER_PX; }
  const label=chosenM>=1000?(chosenM/1000)+" 公里":chosenM+" 米";
  // 用缓存避免每次手势都重建 DOM（防闪烁）
  if(sb._key!==label){
    sb._key=label;
    sb.innerHTML='<div class="bar" style="width:'+barPx.toFixed(0)+'px"></div><div class="num">'+label+'</div>';
  }
}

// 监听主应用广播的导航消息（AI 问答里点“导航到这里”触发）
window.addEventListener("message", function(ev){
  var d=ev.data;
  if(d && d.type==="NAVIGATE_TO" && typeof d.name==="string"){
    handleNavigateTo(d.name);
  }
});

// 处理“显示位置”：把指定地点填入搜索框并定位放大（输入+确认）
let pendingNavigate = null;
function handleNavigateTo(name, retry){
  if(!data || !readyImg || !mapW){
    // 地图尚未就绪，先存起来，等就绪后自动处理
    pendingNavigate = name;
    if(!retry){
      // 注册一个轮询，等就绪后处理
      let tries = 0;
      const tm = setInterval(()=>{
        tries++;
        if(data && readyImg && mapW){
          clearInterval(tm);
          const n2 = pendingNavigate;
          pendingNavigate = null;
          doNavigateTo(n2);
        } else if(tries > 50){
          clearInterval(tm);
          pendingNavigate = null;
          toast('地图尚未加载完成');
        }
      }, 200);
    }
    return;
  }
  doNavigateTo(name);
}

function doNavigateTo(name){
  if(!data || !readyImg || !mapW || !name) return;
  // 填入搜索框
  const li = $("loc-input"); if(li) li.value = name;
  // 找地点：先精确，再包含，再别名
  let p = data.places.find(x=>x.name===name)
       || data.places.find(x=>name.includes(x.name) || x.name.includes(name))
       || (function(){ const an=aliasToName(name); return data.places.find(x=>x.name===an); })();
  if(!p){ toast('未找到该地点：'+name); return; }
  // 模拟搜索聚焦：隐藏底部导航栏
  const bb=$("bottombar"); if(bb){ bb.style.transition='none'; bb.classList.add("dock-out"); }
  const box=$("loc-suggest"); if(box) box.classList.remove("show");
  // 定位放大（核心：就是这一步）
  gotoPlace(p);
  toast('已定位到：'+p.name);
}


$("routeBtn").onclick=calculate;
$("loc-btn2").onclick=()=>{
  // 每次点击都重新定位：保持黄(loc-wait)，重新 startGPS
  startGPS();
};

$("closeResult").onclick=()=>{

function toast(msg){
  let t=$("toast");
  if(!t){
    t=document.createElement("div");
    t.id="toast";
    t.style.cssText="position:fixed;left:50%;top:70px;transform:translateX(-50%);background:rgba(31,41,55,.92);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:99;transition:opacity .3s";
    document.body.appendChild(t);
  }
  t.textContent=msg;
  t.style.opacity=1;
  clearTimeout(t._tm);
  t._tm=setTimeout(()=>{t.style.opacity=0},2200);
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

// zoom control +/-
let __zoomAnimId=0; // 当前缩放动画的 rAF id，用于打断旧动画
function zoomByButton(f){
  const v=$("viewport");
  const cx=v.clientWidth/2, cy=v.clientHeight/2;
  // 打断上一个未完成的动画：从当前 scale 出发，立即开始新动画
  if(__zoomAnimId) cancelAnimationFrame(__zoomAnimId);
  const startScale=scale, startTx=tx, startTy=ty;
  const targetScale=Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale*f));
  const el=$("transform"); el.classList.remove("animate"); clearTimeout(el._animTm);
  // 帧计数 + 线性插值：卡顿时变慢但完整播完；被打断时从当前进度线性移到新目标，不突兀
  const totalFrames=15, frameStep=1/totalFrames;
  let frame=0;
  function step(){
    frame++;
    const p=Math.min(1, frame*frameStep);
    const s=startScale+(targetScale-startScale)*p; // 线性：不缓出
    const k=s/startScale;
    tx=cx-k*(cx-startTx); ty=cy-k*(cy-startTy);
    scale=s;
    applyTransform();
    if(frame<totalFrames) __zoomAnimId=requestAnimationFrame(step);
    else __zoomAnimId=0; // 动画结束
  }
  __zoomAnimId=requestAnimationFrame(step);
}
$("zoom-in").onclick=()=>zoomByButton(1.7);
$("zoom-out").onclick=()=>zoomByButton(1/1.7);

// reposition disclaimer: desktop -> body (fixed bottom-right), mobile -> inside form
const _dq = window.matchMedia("(min-width:768px)");
function reposeDisclaimer(){
  const d = document.querySelector(".disclaimer");
  const form = document.getElementById("route-form");
  if(!d || !form) return;
  if(_dq.matches){
    if(d.parentNode !== document.body) document.body.appendChild(d);
  } else {
    if(d.parentNode !== form){
      const btnRow = form.querySelector(".btn-row");
      if(btnRow) form.insertBefore(d, btnRow);
    }
  }
}
if(_dq.addEventListener){ _dq.addEventListener("change", reposeDisclaimer); }
reposeDisclaimer();

// compass click -> rotate back to north (rot = 0), keep scale/position
let __rotAnimId=0; // 回正动画 rAF id，连点时取消旧动画避免叠加
function resetRotation(){
  // 打断上一个未完成的回正动画：从当前 rot 出发，立即开始新动画
  if(__rotAnimId) cancelAnimationFrame(__rotAnimId);
  const v=$("viewport");
  const sx=v.clientWidth/2, sy=v.clientHeight/2;
  const m=screenToMap(sx, sy);
  const cx=mapCx(), cy=mapCy();
  const startRot=rot;
  const el=$("transform"); el.classList.remove("animate"); clearTimeout(el._animTm);
  // 帧计数 + 线性插值：卡顿时变慢但完整播完；被打断时从当前进度线性移到新目标
  const totalFrames=15, frameStep=1/totalFrames;
  let frame=0;
  function step(){
    frame++;
    const p=Math.min(1, frame*frameStep);
    rot=startRot*(1-p); // 线性：不缓出
    const rad=rot*Math.PI/180;
    const cos=Math.cos(rad), sin=Math.sin(rad);
    const px=m.x-cx, py=m.y-cy;
    const rx=px*scale, ry=py*scale;
    const rxr=rx*cos-ry*sin, ryr=rx*sin+ry*cos;
    tx=sx-rxr; ty=sy-ryr;
    applyTransform();
    if(frame<totalFrames) __rotAnimId=requestAnimationFrame(step);
    else __rotAnimId=0; // 动画结束
  }
  __rotAnimId=requestAnimationFrame(step);
}
$("compass").addEventListener("click", resetRotation);
